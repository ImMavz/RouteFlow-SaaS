name: routeflow-prod

services:
  # ---------- Base de datos (PostgreSQL + PostGIS) ----------
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routeflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routeflow-network

  # ---------- Servidor de Ruteo OSRM ----------
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 100 /data/map.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - osrm-prod-data:/data
    networks:
      - routeflow-network

  # ---------- Microservicio de Optimización (FastAPI / OR-Tools) ----------
  optimizer:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}-optimizer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OSRM_URL: http://osrm:5000
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-10}
      MAX_LOCATIONS: "100"
    depends_on:
      - osrm
    ports:
      - "${OPTIMIZER_PORT:-8000}:8000"
    networks:
      - routeflow-network

  # ---------- Backend (NestJS) ----------
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      OPTIMIZER_URL: http://optimizer:8000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - routeflow-network

  # ---------- Frontend (React + Vite en Nginx) ----------
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - routeflow-network

volumes:
  postgres-prod-data:
  osrm-prod-data:

networks:
  routeflow-network:
    driver: bridge
