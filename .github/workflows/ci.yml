name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # --- Backend Quality Gate ---
      - name: Install Backend dependencies
        run: |
          cd backend
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Backend Lint
        run: |
          cd backend
          pnpm run lint

      - name: Backend Tests
        run: |
          cd backend
          pnpm run test

      - name: Backend Build
        run: |
          cd backend
          pnpm run build

      # --- Frontend Quality Gate ---
      - name: Install Frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Frontend Lint
        run: |
          cd frontend
          pnpm run lint

      - name: Frontend Tests
        run: |
          cd frontend
          pnpm run --if-present test

      - name: Frontend Build
        run: |
          cd frontend
          pnpm run build

      # --- Docker Build Verification (sin subir imágenes) ---
      - name: Verify Docker build (Backend)
        run: docker build -t local-backend:${{ github.sha }} ./backend

      - name: Verify Docker build (Frontend)
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL || 'http://localhost:3000' }}" \
            -t local-frontend:${{ github.sha }} \
            ./frontend

      - name: Verify Docker build (Optimizer)
        run: docker build -t local-optimizer:${{ github.sha }} ./optimizer

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        shell: bash
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Build and push Optimizer image
        uses: docker/build-push-action@v6
        with:
          context: ./optimizer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-optimizer:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-optimizer:latest
