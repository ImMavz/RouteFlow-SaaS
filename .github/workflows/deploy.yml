name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          TAG="sha-$SHA"
          echo "Desplegando versión $TAG en VPS ($VPS_HOST)..."

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd /opt/routeflow
            export IMAGE_TAG='$TAG'
            docker compose -f compose.production.yml pull
            docker compose -f compose.production.yml up -d --remove-orphans
            docker compose -f compose.production.yml ps
          "

      - name: Verify Health Check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || '3000' }}
        run: |
          echo "Verificando salud del backend en http://${VPS_HOST}:${BACKEND_PORT}/health ..."
          # Reintenta 5 veces con 3s de espera para permitir el arranque completo del contenedor
          curl --fail --retry 5 --retry-delay 3 "http://${VPS_HOST}:${BACKEND_PORT}/health" || {
            echo "Aviso: No se pudo verificar el health check externo directo en el puerto ${BACKEND_PORT} (puede requerir túnel o HTTPS en proxy)."
          }
